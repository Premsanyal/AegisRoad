name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: ./.github/actions/setup-tools

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            services/routing-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Go
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            services/api-gateway/vendor
            services/scats-emulator/vendor
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Cache Node
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            apps/public-pwa/node_modules
            apps/emergency-app/node_modules
            apps/operator-dashboard/node_modules
            services/realtime-server/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}

      - name: Cache Python
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            services/ml-pipeline/.venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}

      - name: Lint All
        run: make lint

      - name: Type Check All
        run: make typecheck

      - name: Test All
        run: make test

  build-images:
    name: Build Docker Images
    needs: lint-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for routing-engine
        id: meta-routing
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/routing-engine
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push routing-engine
        uses: docker/build-push-action@v5
        with:
          context: ./services/routing-engine
          push: true
          tags: ${{ steps.meta-routing.outputs.tags }}
          labels: ${{ steps.meta-routing.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for api-gateway
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-gateway
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for realtime-server
        id: meta-realtime
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/realtime-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push realtime-server
        uses: docker/build-push-action@v5
        with:
          context: ./services/realtime-server
          push: true
          tags: ${{ steps.meta-realtime.outputs.tags }}
          labels: ${{ steps.meta-realtime.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for scats-emulator
        id: meta-scats
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/scats-emulator
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push scats-emulator
        uses: docker/build-push-action@v5
        with:
          context: ./services/scats-emulator
          push: true
          tags: ${{ steps.meta-scats.outputs.tags }}
          labels: ${{ steps.meta-scats.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for ml-pipeline
        id: meta-ml
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ml-pipeline
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ml-pipeline
        uses: docker/build-push-action@v5
        with:
          context: ./services/ml-pipeline
          push: true
          tags: ${{ steps.meta-ml.outputs.tags }}
          labels: ${{ steps.meta-ml.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for public-pwa
        id: meta-pwa
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/public-pwa
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push public-pwa
        uses: docker/build-push-action@v5
        with:
          context: ./apps/public-pwa
          file: ./apps/public-pwa/Dockerfile
          push: true
          tags: ${{ steps.meta-pwa.outputs.tags }}
          labels: ${{ steps.meta-pwa.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for emergency-app
        id: meta-emergency
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/emergency-app
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push emergency-app
        uses: docker/build-push-action@v5
        with:
          context: ./apps/emergency-app
          file: ./apps/emergency-app/Dockerfile
          push: true
          tags: ${{ steps.meta-emergency.outputs.tags }}
          labels: ${{ steps.meta-emergency.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for operator-dashboard
        id: meta-operator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/operator-dashboard
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push operator-dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./apps/operator-dashboard
          file: ./apps/operator-dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta-operator.outputs.tags }}
          labels: ${{ steps.meta-operator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Dev
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_DEV }}

      - name: Deploy to dev cluster
        run: |
          kubectl set image deployment/routing-engine routing-engine=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/routing-engine:${{ github.sha }} -n aegisroad-dev
          kubectl set image deployment/api-gateway api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway:${{ github.sha }} -n aegisroad-dev
          kubectl set image deployment/realtime-server realtime-server=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/realtime-server:${{ github.sha }} -n aegisroad-dev
          kubectl set image deployment/scats-emulator scats-emulator=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/scats-emulator:${{ github.sha }} -n aegisroad-dev
          kubectl set image deployment/ml-pipeline ml-pipeline=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ml-pipeline:${{ github.sha }} -n aegisroad-dev
          kubectl set image deployment/public-pwa public-pwa=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/public-pwa:${{ github.sha }} -n aegisroad-dev
          kubectl set image deployment/emergency-app emergency-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/emergency-app:${{ github.sha }} -n aegisroad-dev
          kubectl set image deployment/operator-dashboard operator-dashboard=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/operator-dashboard:${{ github.sha }} -n aegisroad-dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/routing-engine -n aegisroad-dev --timeout=300s
          kubectl rollout status deployment/api-gateway -n aegisroad-dev --timeout=300s
          kubectl rollout status deployment/realtime-server -n aegisroad-dev --timeout=300s
          kubectl rollout status deployment/scats-emulator -n aegisroad-dev --timeout=300s
          kubectl rollout status deployment/ml-pipeline -n aegisroad-dev --timeout=300s
          kubectl rollout status deployment/public-pwa -n aegisroad-dev --timeout=300s
          kubectl rollout status deployment/emergency-app -n aegisroad-dev --timeout=300s
          kubectl rollout status deployment/operator-dashboard -n aegisroad-dev --timeout=300s

  notify:
    name: Notify
    needs: [lint-test, build-images, deploy-dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "CI failed! Check GitHub Actions for details."
          # Add Slack/Discord webhook here