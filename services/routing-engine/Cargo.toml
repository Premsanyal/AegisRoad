[package]
name = "routing-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tonic = { version = "0.10", features = ["transport", "codegen"] }
prost = "0.12"
prost-types = "0.12"
sqlx = { git = "https://github.com/launchbadge/sqlx", branch = "main", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
geo = { version = "0.7" }
geojson = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
config = "0.13"
dotenvy = "0.15"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json"] }
tokio-stream = "0.1"
futures = "0.3"
tonic-health = "0.10"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }

[build-dependencies]
tonic-build = "0.10"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"