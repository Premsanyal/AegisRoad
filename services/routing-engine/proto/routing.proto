syntax = "proto3";

package aegisroad.routing;

option go_package = "github.com/premsanyal/aegisroad/gen/go/routing";
option java_package = "com.aegisroad.routing";
option java_multiple_files = true;

service RoutingService {
  // Calculate a route with priority-based logic
  rpc CalculateRoute(RouteRequest) returns (RouteResponse);

  // Stream real-time route updates (traffic changes, incidents)
  rpc StreamRouteUpdates(RouteRequest) returns (stream RouteUpdate);

  // Reserve a corridor for emergency vehicle (preemptive)
  rpc ReserveCorridor(CorridorRequest) returns (CorridorResponse);

  // Release a previously reserved corridor
  rpc ReleaseCorridor(CorridorRelease) returns (google.protobuf.Empty);

  // Get current congestion levels for a bounding box
  rpc GetCongestionMap(CongestionRequest) returns (CongestionResponse);
}

// Request for route calculation
message RouteRequest {
  string request_id = 1;
  int32 priority_level = 2;           // 0=public, 1=high, 2=emergency, 3=vip
  Point origin = 3;
  Point destination = 4;
  string vehicle_id = 5;
  string vehicle_type = 6;            // "ambulance", "fire", "police", "public", etc.
  repeated string avoid_segments = 7; // OSM IDs to avoid
  bool return_alternatives = 8;
  int32 max_alternatives = 9;
  RoutingProfile profile = 10;        // car, bike, foot
  json_options options = 11;          // JSON string for extra options
}

// Routing profile
enum RoutingProfile {
  PROFILE_UNSPECIFIED = 0;
  PROFILE_CAR = 1;
  PROFILE_BIKE = 2;
  PROFILE_FOOT = 3;
  PROFILE_EMERGENCY = 4;
}

// Route response with primary and alternative routes
message RouteResponse {
  string request_id = 1;
  Route primary_route = 2;
  repeated Route alternative_routes = 3;
  RouteStatus status = 4;
  string error_message = 5;
  int64 calculated_at = 6; // Unix timestamp ms
}

// Route status
enum RouteStatus {
  ROUTE_STATUS_UNSPECIFIED = 0;
  ROUTE_STATUS_OK = 1;
  ROUTE_STATUS_NO_ROUTE = 2;
  ROUTE_STATUS_PARTIAL = 3;
  ROUTE_STATUS_ERROR = 4;
}

// Individual route
message Route {
  string route_id = 1;
  repeated Point geometry = 2;           // Ordered points along route
  repeated SegmentInfo segments = 3;     // Detailed segment info
  int64 distance_meters = 4;
  int32 duration_seconds = 5;            // Base duration
  int32 duration_with_traffic_seconds = 6; // With current traffic
  int32 congestion_level = 7;            // Max congestion on route (0-5)
  bool uses_reserved_lanes = 8;
  repeated IncidentWarning warnings = 9;
  json_options metadata = 10;
}

// Segment details
message SegmentInfo {
  int64 segment_id = 1;           // road_segments.id
  int64 osm_id = 2;
  string name = 3;
  string highway_type = 4;
  int32 max_speed = 5;
  int32 current_speed = 6;
  int32 congestion_level = 7;
  int64 length_meters = 8;
  int32 duration_seconds = 9;
  bool is_reserved = 10;
  bool is_oneway = 11;
}

// Incident warning on route
message IncidentWarning {
  string incident_id = 1;
  Point location = 2;
  string type = 3;
  int32 severity = 4;
  string description = 5;
  int32 delay_seconds = 6;
}

// Real-time route update stream
message RouteUpdate {
  string request_id = 1;
  RouteUpdateType type = 2;
  Route updated_route = 3;
  IncidentWarning new_incident = 4;
  CongestionChange congestion_change = 5;
  int64 timestamp = 6;
}

enum RouteUpdateType {
  ROUTE_UPDATE_UNSPECIFIED = 0;
  ROUTE_UPDATE_RECALCULATED = 1;
  ROUTE_UPDATE_INCIDENT = 2;
  ROUTE_UPDATE_CONGESTION = 3;
  ROUTE_UPDATE_ARRIVED = 4;
}

// Congestion change notification
message CongestionChange {
  int64 segment_id = 1;
  int32 old_level = 2;
  int32 new_level = 3;
}

// Corridor reservation for emergency vehicles
message CorridorRequest {
  string reservation_id = 1;
  string vehicle_id = 2;
  repeated Point corridor_path = 3;     // Path to reserve
  int32 lookahead_meters = 4;           // How far ahead to reserve
  int64 expires_at = 5;                 // Unix timestamp ms
  int32 priority_level = 6;
}

message CorridorResponse {
  string reservation_id = 1;
  bool success = 2;
  string error_message = 3;
  repeated int64 reserved_segment_ids = 4;
  int64 expires_at = 5;
}

message CorridorRelease {
  string reservation_id = 1;
}

// Congestion map query
message CongestionRequest {
  BoundingBox bbox = 1;
  int32 zoom_level = 2;
}

message CongestionResponse {
  repeated CongestionSegment segments = 1;
  int64 timestamp = 2;
}

message CongestionSegment {
  int64 segment_id = 1;
  int64 osm_id = 2;
  repeated Point geometry = 3;
  int32 congestion_level = 4;
  int32 current_speed = 5;
  int32 max_speed = 6;
}

// Geometry types
message Point {
  double longitude = 1;
  double latitude = 2;
}

message BoundingBox {
  Point southwest = 1;
  Point northeast = 2;
}

// JSON options as string (flexible)
message json_options {
  string value = 1;
}

import "google/protobuf/empty.proto";